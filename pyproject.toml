[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-operational-evidence-system"
version = "0.2.0"
description = "Edge-first reference system for reproducible operational evidence"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Martin CG" }]
dependencies = []

[project.scripts]
edge-evidence-simulate = "edge_evidence.simulator:main"
edge-evidence-campaign = "edge_evidence.campaign:main"
edge-evidence-bundle = "edge_evidence.bundle:main"
edge-evidence-recovery = "edge_evidence.recovery:main"
edge-evidence-historical = "edge_evidence.historical:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
mqtt = ["paho-mqtt>=2.1,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = ["integration: requires an explicitly started external service"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
