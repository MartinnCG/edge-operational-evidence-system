[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "edge-operational-evidence-system"
version = "0.1.0.dev0"
description = "Edge-first reference system for reproducible operational evidence"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Martin CG" }]
dependencies = []

[project.scripts]
edge-evidence-simulate = "edge_evidence.simulator:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
