listener 8883 0.0.0.0
allow_anonymous false

cafile /mosquitto/secrets/ca.crt
certfile /mosquitto/secrets/broker.crt
keyfile /mosquitto/secrets/broker.key
require_certificate true
use_identity_as_username true
tls_version tlsv1.2

acl_file /mosquitto/config/acl

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
