name: Quality gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Build and independently verify synthetic evidence bundle
        run: |
          python -m edge_evidence.bundle build-demo missing \
            --output /tmp/edge-evidence-ci \
            --bundle-id ci-synthetic-missing \
            --created-at 2026-01-02T03:04:05Z
          python -m edge_evidence.bundle verify /tmp/edge-evidence-ci

      - name: Prove abrupt restart and deterministic recovery
        run: |
          python -m edge_evidence.recovery run \
            --workspace /tmp/edge-recovery-ci \
            --count 8 \
            --crash-after 4

  mqtt-integration:
    name: Mosquitto 2.1 / Paho 2.x
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package, tests and MQTT client
        run: python -m pip install -e ".[dev,mqtt]"

      - name: Start pinned Mosquitto broker
        run: docker compose -f ops/mqtt/compose.yml up -d --wait

      - name: Test retained QoS 1 delivery and broker reconnect
        env:
          MQTT_INTEGRATION: "1"
        run: python -m pytest tests/test_mqtt_integration.py -m integration

      - name: Capture broker logs
        if: always()
        run: docker compose -f ops/mqtt/compose.yml logs --no-color

      - name: Remove broker and test volume
        if: always()
        run: docker compose -f ops/mqtt/compose.yml down --volumes

  mqtt-security:
    name: Mosquitto mutual TLS / ACL
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package, tests and MQTT client
        run: python -m pip install -e ".[dev,mqtt]"

      - name: Generate ephemeral synthetic PKI
        run: sh ops/mqtt-secure/generate-test-pki.sh

      - name: Start mutual-TLS Mosquitto broker
        run: docker compose -f ops/mqtt-secure/compose.yml up -d --wait

      - name: Test certificate identity and role ACLs
        env:
          MQTT_SECURITY_INTEGRATION: "1"
        run: >-
          python -m pytest tests/test_mqtt_security_integration.py
          -m integration

      - name: Capture secure broker logs
        if: always()
        run: docker compose -f ops/mqtt-secure/compose.yml logs --no-color

      - name: Remove secure broker
        if: always()
        run: docker compose -f ops/mqtt-secure/compose.yml down --volumes
