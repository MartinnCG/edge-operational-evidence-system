name: Quality gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Test
        run: python -m pytest

      - name: Build and independently verify synthetic evidence bundle
        run: |
          python -m edge_evidence.bundle build-demo missing \
            --output /tmp/edge-evidence-ci \
            --bundle-id ci-synthetic-missing \
            --created-at 2026-01-02T03:04:05Z
          python -m edge_evidence.bundle verify /tmp/edge-evidence-ci
